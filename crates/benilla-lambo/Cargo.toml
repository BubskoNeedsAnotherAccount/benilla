[package]
name = "benilla-lambo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A crate on top of benilla: drive a Lamborghini through The Barrens on the world engine, with no game attached"

[lints]
workspace = true

[features]
# The dev/player seam, as `benilla-world` has it: `benilla-formats` and `-assets` come in without
# default features and their `dev` is forwarded, or unification would put it back in a player build.
default = ["dev"]
dev = ["benilla-world/dev", "benilla-formats/dev", "benilla-assets/dev"]

[dependencies]
benilla-assets = { path = "../benilla-assets", default-features = false }
benilla-formats = { path = "../benilla-formats", default-features = false }
benilla-world = { path = "../benilla-world", default-features = false }
bevy = { workspace = true, features = ["bevy_gltf"] }
bevy_egui = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
benilla-mpq = { path = "../benilla-mpq" }
engine-core = { path = "../engine-core" }
kira = { version = "0.12", features = ["cpal", "wav"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "console",
    "Blob",
    "File",
    "FileList",
] }

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "benilla-lambo"
path = "src/main.rs"
